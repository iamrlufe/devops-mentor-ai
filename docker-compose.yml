services:
  postgres:
    image: postgres:17.10
    container_name: mentor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - ./docker/postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: mentor-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./docker/qdrant:/qdrant/storage

  api:
    build: .
    container_name: mentor-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - qdrant

    env_file:
      - .env

    # Overrides the host value from .env: inside the container Qdrant is
    # reachable by its service name, not on localhost.
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: postgres

    # The documentation is data, not code: it is mounted instead of being baked
    # into the image, so indexing new files needs no rebuild.
    volumes:
      - ./docs:/app/docs:ro

  telegram-bot:
    build: .
    container_name: mentor-telegram-bot
    restart: unless-stopped
    command: python -m bot.main

    # The bot reads and writes profiles, so it needs the same database.
    environment:
      POSTGRES_HOST: postgres

    depends_on:
      - api
      - postgres

    env_file:
      - .env
