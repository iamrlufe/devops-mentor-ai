services:
  postgres:
    image: postgres:17
    container_name: mentor-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - ./docker/postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mentor-qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./docker/qdrant:/qdrant/storage

  api:
    build: .
    container_name: mentor-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - qdrant

    env_file:
      - .env

  telegram-bot:
    build: .
    container_name: mentor-telegram-bot
    restart: unless-stopped
    command: python -m bot.main

    depends_on:
      - api

    env_file:
      - .env
